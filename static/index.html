<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #ddd; font: 15px/1.4 system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  nav { display: flex; gap: 16px; padding: 10px 16px; background: #1a1a1a; }
  nav a.on { color: #fff; font-weight: 600; }
  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .vol { padding: 12px; background: #1c1c1c; border-radius: 6px; }
  .vol:hover { background: #262626; }
  .vol small { color: #888; display: block; }
  .continue { display: inline-block; margin-bottom: 16px; padding: 8px 12px; background: #2a2a2a; border-radius: 6px; }
  .fav .thumbs { display: flex; flex-direction: row-reverse; }
  .fav img { width: 100%; min-width: 0; display: block; border-radius: 4px; }
  .fav small { color: #888; }
  #reader { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  /* row-reverse: manga reads right to left, so the first page of a spread sits on the right */
  #pages { display: flex; flex-direction: row-reverse; }
  #pages img { max-height: 100vh; max-width: 100vw; user-select: none; display: block; }
  #pages.two img { max-width: 50vw; }
  #reader.width { overflow-y: auto; align-items: flex-start; }
  #reader.width img { max-height: none; width: min(100vw, 1000px); }
  #reader.width .two img { width: 50vw; }
  #hud { position: fixed; top: 8px; left: 8px; background: #000a; padding: 4px 10px;
         border-radius: 6px; font-size: 13px; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  #hud button { background: none; border: 0; color: #888; font-size: 18px; cursor: pointer; padding: 0; }
  #hud button.on { color: gold; }
  #hud label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #home { padding: 2px 8px; background: #333; border-radius: 4px; }
  #home:hover { background: #444; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #000c; padding: 6px 14px;
           border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const app = document.getElementById('app');
let volumes = [];
let favs = new Set();           // "volume|13,14" (a favorite is a single page or a whole spread)
const favKey = (v, pages) => v + '|' + pages.join(',');
const enc = encodeURIComponent;
const opt = k => localStorage.getItem(k) === '1';
const setOpt = (k, on) => localStorage.setItem(k, on ? '1' : '0');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t.timer);
  t.timer = setTimeout(() => t.classList.remove('show'), 900);
}

function nav(active) {
  return `<nav><a href="#/" class="${active === 'lib' ? 'on' : ''}">Library</a>
              <a href="#/favorites" class="${active === 'fav' ? 'on' : ''}">Favorites (${favs.size})</a></nav>`;
}

function getLast() {
  try { return JSON.parse(localStorage.getItem('last')); } catch { return null; }
}

function showLibrary() {
  const last = getLast();
  const lastVol = last && volumes.find(v => v.id === last.volume);
  app.innerHTML = nav('lib') + `<main>
    ${lastVol ? `<a class="continue" href="#/read/${enc(lastVol.id)}/${last.page}">Continue: ${lastVol.title}, page ${last.page + 1}</a>` : ''}
    <div class="grid">${volumes.map(v =>
      `<a class="vol" href="#/read/${enc(v.id)}/0">${v.title}<small>${v.pages} pages</small></a>`).join('')}
    </div></main>`;
}

async function showFavorites() {
  const list = await (await fetch('/api/favorites')).json();
  list.sort((a, b) => b.added - a.added);
  const title = id => (volumes.find(v => v.id === id) || {}).title || id;
  app.innerHTML = nav('fav') + `<main>${list.length ? '' : '<p>No favorites yet. Press <b>f</b> while reading.</p>'}
    <div class="grid">${list.map(f =>
      `<a class="fav" href="#/read/${enc(f.volume)}/${f.pages[0]}">
         <div class="thumbs">${f.pages.map(p => `<img loading="lazy" src="/api/thumb/${enc(f.volume)}/${p}">`).join('')}</div>
         <small>${title(f.volume)}, p. ${f.pages.map(p => p + 1).join('–')}</small></a>`).join('')}
    </div></main>`;
}

// --- page sizes & spreads ------------------------------------------------------

const sizes = {};  // volume id -> [[w, h], ...]

async function getSizes(vid) {
  if (!sizes[vid]) sizes[vid] = await (await fetch(`/api/sizes/${enc(vid)}`)).json();
  return sizes[vid];
}

// Groups a volume's pages into what's shown at once: [[0], [1, 2], [3], ...].
// The cover and wide (double-page) images are always shown alone.
// "shift" makes page 1 single too, for scans whose pairs come out off by one.
function spreadsFor(vid) {
  const dims = sizes[vid];
  if (!opt('spread')) return dims.map((_, i) => [i]);
  const wide = i => dims[i][0] > dims[i][1];
  const alone = new Set(opt('shift') ? [0, 1] : [0]);
  const out = [];
  for (let i = 0; i < dims.length;) {
    if (alone.has(i) || wide(i) || i + 1 >= dims.length || wide(i + 1)) out.push([i++]);
    else { out.push([i, i + 1]); i += 2; }
  }
  return out;
}

// --- reader ----------------------------------------------------------------------

let reader = null;  // { vi, page } where page is the first page of the current spread

async function showReader(vid, page) {
  const vi = volumes.findIndex(v => v.id === vid);
  if (vi < 0) return location.hash = '#/';
  reader = { vi, page: Math.min(page, volumes[vi].pages - 1) };
  app.innerHTML = `<div id="reader" class="${opt('fitWidth') ? 'width' : ''}"><div id="pages"></div></div>
    <div id="hud">
      <a href="#/" id="home" title="Back to volumes (Esc)">← Home</a>
      <span id="pos"></span>
      <button id="star" title="Favorite (f)">★</button>
      <label title="Show two pages side by side"><input type="checkbox" id="spread" ${opt('spread') ? 'checked' : ''}> 2 pages</label>
    </div>`;
  document.getElementById('reader').onclick = e => (e.clientX > innerWidth / 2 ? turn(1) : turn(-1));
  document.getElementById('star').onclick = toggleFav;
  document.getElementById('spread').onchange = e => {
    setOpt('spread', e.target.checked);
    e.target.blur();  // otherwise space (next page) would toggle the checkbox
    render();
  };
  await getSizes(vid);
  if (reader) render();
}

function currentSpread() {
  const sp = spreadsFor(volumes[reader.vi].id);
  return sp.find(s => s.includes(reader.page)) || sp[0];
}

function render() {
  const v = volumes[reader.vi];
  const src = p => `/api/page/${enc(v.id)}/${p}`;
  const spread = currentSpread();
  reader.page = spread[0];
  const pages = document.getElementById('pages');
  pages.className = spread.length === 2 ? 'two' : '';
  pages.innerHTML = spread.map(p => `<img src="${src(p)}" alt="">`).join('');
  document.getElementById('pos').textContent =
    `${v.title} · ${spread.map(p => p + 1).join('–')} / ${v.pages}`;
  renderStar();
  document.getElementById('reader').scrollTop = 0;
  const after = spread[spread.length - 1];
  for (let p = after + 1; p <= after + 4 && p < v.pages; p++) new Image().src = src(p);
  history.replaceState(null, '', `#/read/${enc(v.id)}/${reader.page}`);
  localStorage.setItem('last', JSON.stringify({ volume: v.id, page: reader.page }));
}

function renderStar() {
  document.getElementById('star').classList.toggle('on', favs.has(favKey(volumes[reader.vi].id, currentSpread())));
}

async function turn(d) {
  let { vi } = reader;
  const sp = spreadsFor(volumes[vi].id);
  const si = sp.findIndex(s => s.includes(reader.page)) + d;
  if (si >= sp.length) {
    if (vi + 1 >= volumes.length) return toast('Last page');
    vi++;
    await getSizes(volumes[vi].id);
    if (!reader) return;
    reader = { vi, page: 0 };
    toast(volumes[vi].title);
  } else if (si < 0) {
    if (vi === 0) return toast('First page');
    vi--;
    await getSizes(volumes[vi].id);
    if (!reader) return;
    reader = { vi, page: spreadsFor(volumes[vi].id).at(-1)[0] };
    toast(volumes[vi].title);
  } else {
    reader = { vi, page: sp[si][0] };
  }
  render();
}

async function toggleFav() {
  const volume = volumes[reader.vi].id, pages = currentSpread();
  const r = await fetch('/api/favorites/toggle', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ volume, pages }),
  });
  const { favorited } = await r.json();
  favorited ? favs.add(favKey(volume, pages)) : favs.delete(favKey(volume, pages));
  toast(favorited ? '★ Favorited' : 'Removed from favorites');
  if (reader) renderStar();
}

document.addEventListener('keydown', e => {
  if (!reader || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'd' || k === ' ') { e.preventDefault(); turn(1); }
  else if (k === 'ArrowLeft' || k === 'a') turn(-1);
  else if (k === 'f') toggleFav();
  else if (k === 'o' && opt('spread')) {
    setOpt('shift', !opt('shift'));
    toast('Page pairing shifted');
    render();
  }
  else if (k === 'w') setOpt('fitWidth', document.getElementById('reader').classList.toggle('width'));
  else if (k === 'Escape') location.hash = '#/';
});

function route() {
  const h = location.hash.slice(1) || '/';
  const m = h.match(/^\/read\/([^/]+)\/(\d+)$/);
  if (m) {
    const vid = decodeURIComponent(m[1]), page = +m[2];
    // replaceState in render() doesn't fire hashchange, so this only runs on real navigation
    if (!reader || volumes[reader.vi].id !== vid || reader.page !== page) showReader(vid, page);
    return;
  }
  reader = null;
  h === '/favorites' ? showFavorites() : showLibrary();
}

(async () => {
  const [v, f] = await Promise.all([fetch('/api/volumes').then(r => r.json()), fetch('/api/favorites').then(r => r.json())]);
  volumes = v;
  favs = new Set(f.map(x => favKey(x.volume, x.pages)));
  addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
